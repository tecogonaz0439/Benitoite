# cargo-about の設定（設計書 05-01「ライセンスの表示」、ADR 0235・0334、実装プラン 10-19「第三者のライセンスの表示」）。
# accepted は deny.toml の [licenses] の allow と同じものを同じ並びで書く。cargo-about は並びを優先の順に読むので、
# 二重ライセンスのクレート（MIT OR Apache-2.0 など）は MIT として載る。
accepted = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause"]
# licenses.sh が、ビルド先ごとにこの行を一つのビルド先に置き換えた設定を作る。
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
# publish = false の処理系自身を一覧から外す。
private = { ignore = true }
