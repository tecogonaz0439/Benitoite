name = "benitoite-formal"
defaultTargets = ["Benitoite", "desugarDiff", "builtinCheck", "coverageDiff", "coverageProgramDiff", "surfaceCheck", "surfaceCheckAll", "intervalDiff"]
# Lean のプロセスごとのメモリの上限（MiB）。証明の計算の展開でメモリが際限なく増えるのを止める。
moreLeanArgs = ["-M", "12288"]

[[lean_lib]]
name = "Benitoite"

[[lean_exe]]
name = "desugarDiff"
root = "DesugarDiff.Main"

[[lean_exe]]
name = "builtinCheck"
root = "BuiltinCheck.Main"

[[lean_exe]]
name = "coverageDiff"
root = "CoverageDiff.Main"

[[lean_exe]]
name = "coverageProgramDiff"
root = "CoverageProgramDiff.Main"

[[lean_exe]]
name = "surfaceCheck"
root = "SurfaceCheck.Main"
[[lean_exe]]
name = "surfaceCheckAll"
root = "SurfaceCheck.All"

[[lean_lib]]
name = "SurfaceCheck"

[[lean_exe]]
name = "intervalDiff"
root = "IntervalDiff.Main"
