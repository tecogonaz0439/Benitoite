# パッケージ Fuzzy の WASM のコンポーネントを作る Rust のクレート（案。版と手順は未確認）。
#
# 作り方の案（フェーズ 1 で確かめる）:
#   cargo build --release --target wasm32-unknown-unknown
#   wasm-tools component new target/wasm32-unknown-unknown/release/fuzzy.wasm -o ../wasm/fuzzy.wasm
#   wasm-tools component wit ../wasm/fuzzy.wasm     # imports が空であることを確かめる

[package]
name = "fuzzy"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.x"  # 版は改造のときに決める

[profile.release]
opt-level = "s"
panic = "abort"
