[package]
name = "bnt-wasm-regex"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.62.0"
regex = "=1.13.1"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[workspace]
