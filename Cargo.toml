[workspace]
resolver = "3"
members = ["crates/benitoite"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
let_underscore_must_use = "deny"
clone_on_ref_ptr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
overflow-checks = true
panic = "unwind"

# debug の検査でも大きな WASM コンポーネントを短時間でコンパイルするため、実行系とコンパイラを最適化する（設計書 07-03「実装の規約と静的な検査」）。
# cargo tree で本体から Wasmtime・Cranelift に至る依存を確かめ、aarch64 の macOS で測った構成のクレートを選んだ。
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.cranelift-bitset]
opt-level = 2
[profile.dev.package.cranelift-native]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-internal-core]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
